<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيشيك IA - منصة التدريب واللعب الذكية</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .menu-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        h1 {
            font-size: 1.4rem;
            color: #4CAF50;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background-color: #1e1e1e;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
            transition: right 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff5252;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .menu-item {
            background: #2a2a2a;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            cursor: pointer;
            text-align: right;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item.active {
            border-color: #4CAF50;
            background: #2e4c30;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.active { display: block; }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #board-container {
            position: relative;
            width: 100%;
        }

        #board {
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        /* تصميم رقعة وقطع الداما */
        .checkers-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cell.light { background-color: #f0d9b5; }
        .cell.dark { background-color: #b58863; }

        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.4), 0 3px 6px rgba(0,0,0,0.5);
            user-select: none;
            transition: transform 0.2s;
        }

        .piece.white {
            background: radial-gradient(circle, #ffffff 40%, #cccccc 100%);
            border: 2px solid #999;
            color: #333;
        }

        .piece.red {
            background: radial-gradient(circle, #e53935 40%, #b71c1c 100%);
            border: 2px solid #7f0000;
            color: #fff;
        }

        .cell.selected {
            background-color: #769656 !important;
        }

        .cell.highlight {
            background-color: #baca44 !important;
            cursor: pointer;
        }

        .media-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        video {
            width: 100%;
            height: 130px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            object-fit: cover;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: #4CAF50; }

        .buttons-group {
            display: flex;
            gap: 10px;
        }

        button.btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-send { background-color: #4CAF50; color: white; }
        .btn-mic { background-color: #E91E63; color: white; }
        .btn-reset { background-color: #ff9800; color: white; }

        #response-box {
            background-color: #1e1e1e;
            border-right: 4px solid #4CAF50;
            padding: 15px;
            border-radius: 6px;
            min-height: 70px;
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: right;
            word-wrap: break-word;
        }

        .status-badge {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>إيشيك IA ♟️</h1>
        <button class="menu-btn" onclick="toggleMenu()">☰ القائمة</button>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>أنماط اللعب</h3>
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-item active" id="menu-chess-ai" onclick="setMode('chess-ai')">
            <span>🤖</span> شطرنج ضد الذكاء الاصطناعي
        </div>
        <div class="menu-item" id="menu-chess-free" onclick="setMode('chess-free')">
            <span>♟️</span> شطرنج حر (تحليل)
        </div>
        <div class="menu-item" id="menu-checkers-ai" onclick="setMode('checkers-ai')">
            <span>🔴</span> داما ضد الذكاء الاصطناعي
        </div>
        <div class="menu-item" id="menu-checkers-free" onclick="setMode('checkers-free')">
            <span>⚪</span> داما حرة (لاعبان/تحليل)
        </div>
        <div class="menu-item" onclick="resetGame(); toggleMenu();">
            <span>🔄</span> إعادة اللعبة الحالية
        </div>
    </div>

    <div class="main-container">
        <div id="board-container">
            <div id="board"></div>
            <div id="checkers-board" class="checkers-board" style="display: none;"></div>
        </div>

        <div class="media-section">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="controls-section">
            <input type="text" id="userTextInput" placeholder="اسأل الذكاء الاصطناعي عن النصيحة والتكتيك...">
            
            <div class="buttons-group">
                <button class="btn-action btn-send" onclick="askAI()">تحليل 🚀</button>
                <button class="btn-action btn-mic" onclick="startSpeech()">الميكروفون 🎙️</button>
                <button class="btn-action btn-reset" onclick="resetGame()">إعادة 🔄</button>
            </div>
        </div>

        <div id="response-box">أهلاً بك في إيشيك IA! اختر اللعبة وابدأ اللعب.</div>
        <div class="status-badge" id="statusBadge">الحالة: جاهز</div>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        var board = null;
        var game = new Chess();
        var currentMode = 'chess-ai';

        // متغيّرات لعبة الداما
        var checkersState = [];
        var checkersTurn = 'white';
        var selectedSquare = null;
        var validMoves = [];

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function pieceTheme(piece) {
            return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));

            document.getElementById('board').style.display = mode.startsWith('chess') ? 'block' : 'none';
            document.getElementById('checkers-board').style.display = mode.startsWith('checkers') ? 'grid' : 'none';

            if (mode === 'chess-ai') {
                document.getElementById('menu-chess-ai').classList.add('active');
                initChessBoard();
            } else if (mode === 'chess-free') {
                document.getElementById('menu-chess-free').classList.add('active');
                initChessBoard();
            } else if (mode === 'checkers-ai') {
                document.getElementById('menu-checkers-ai').classList.add('active');
                initCheckersBoard();
            } else if (mode === 'checkers-free') {
                document.getElementById('menu-checkers-free').classList.add('active');
                initCheckersBoard();
            }
            toggleMenu();
        }

        /* --- الشطرنج --- */
        function onDragStart (source, piece, board, orientation) {
            if (!currentMode.startsWith('chess')) return true;
            if (game.game_over()) return false;
            if (currentMode === 'chess-ai' && game.turn() === 'b') return false;
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            updateChessStatus();

            if (currentMode === 'chess-ai' && !game.game_over() && game.turn() === 'b') {
                document.getElementById('statusBadge').innerText = "الحالة: تفكير الذكاء الاصطناعي...";
                window.setTimeout(makeChessAIMove, 400);
            }
        }

        async function makeChessAIMove() {
            const fen = encodeURIComponent(game.fen());
            try {
                const response = await fetch(`https://stockfish.online/api/s/v2.php?fen=${fen}&depth=10`);
                const data = await response.json();
                if (data.success && data.bestmove) {
                    const bestMove = data.bestmove.split(' ')[1];
                    game.move({ from: bestMove.substring(0, 2), to: bestMove.substring(2, 4), promotion: 'q' });
                    board.position(game.fen());
                    updateChessStatus();
                }
            } catch (err) {
                var moves = game.moves();
                game.move(moves[Math.floor(Math.random() * moves.length)]);
                board.position(game.fen());
                updateChessStatus();
            }
        }

        function updateChessStatus () {
            var status = '';
            var moveColor = game.turn() === 'w' ? 'الأبيض' : 'الأسود';
            if (game.in_checkmate()) status = 'كش مات! فاز ' + (game.turn() === 'w' ? 'الأسود' : 'الأبيض');
            else if (game.in_draw()) status = 'تعادل!';
            else status = 'الدور على: ' + moveColor;
            document.getElementById('statusBadge').innerText = 'الحالة: ' + status;
        }

        function initChessBoard() {
            $('#board').empty();
            game.reset();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: pieceTheme,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: () => board.position(game.fen())
            });
            updateChessStatus();
        }

        /* --- لعبة الداما المتقدمة (الملك يتحرك كالفيل) --- */
        function initCheckersBoard() {
            checkersState = Array(8).fill(null).map(() => Array(8).fill(null));
            checkersTurn = 'white';
            selectedSquare = null;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) checkersState[r][c] = { color: 'red', isKing: false };
                        else if (r > 4) checkersState[r][c] = { color: 'white', isKing: false };
                    }
                }
            }
            renderCheckersBoard();
            updateCheckersStatus();
        }

        function renderCheckersBoard() {
            const container = document.getElementById('checkers-board');
            container.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    cell.className = `cell ${(r + c) % 2 === 1 ? 'dark' : 'light'}`;
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        cell.classList.add('selected');
                    }

                    if (validMoves.some(m => m.r === r && m.c === c)) {
                        cell.classList.add('highlight');
                    }

                    const piece = checkersState[r][c];
                    if (piece) {
                        const pElem = document.createElement('div');
                        pElem.className = `piece ${piece.color}`;
                        if (piece.isKing) pElem.innerHTML = '👑';
                        cell.appendChild(pElem);
                    }

                    cell.addEventListener('click', () => handleCheckersClick(r, c));
                    container.appendChild(cell);
                }
            }
        }

        function handleCheckersClick(r, c) {
            if (currentMode === 'checkers-ai' && checkersTurn === 'red') return;

            const piece = checkersState[r][c];

            if (selectedSquare) {
                const move = validMoves.find(m => m.r === r && m.c === c);
                if (move) {
                    executeCheckersMove(selectedSquare, move);
                    return;
                }
            }

            if (piece && (piece.color === checkersTurn || currentMode === 'checkers-free')) {
                selectedSquare = { r, c };
                validMoves = getCheckersMoves(r, c);
                renderCheckersBoard();
            } else {
                selectedSquare = null;
                validMoves = [];
                renderCheckersBoard();
            }
        }

        // حساب النقلات الحسابية (القطعة العادية + حركة الملك كالفيل)
        function getCheckersMoves(r, c) {
            const piece = checkersState[r][c];
            if (!piece) return [];
            const moves = [];

            const dirs = piece.isKing 
                ? [[-1, -1], [-1, 1], [1, -1], [1, 1]]
                : (piece.color === 'white' ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]);

            dirs.forEach(([dr, dc]) => {
                if (piece.isKing) {
                    // حركة الملك على طول الوتر كالفيل
                    let nr = r + dr, nc = c + dc;
                    let jumped = false;
                    while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        if (!checkersState[nr][nc]) {
                            moves.push({ r: nr, c: nc, jump: jumped ? { r: nr - dr, c: nc - dc } : null });
                        } else if (checkersState[nr][nc].color !== piece.color && !jumped) {
                            jumped = true;
                        } else {
                            break;
                        }
                        nr += dr; nc += dc;
                    }
                } else {
                    // حركة القطعة العادية
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        if (!checkersState[nr][nc]) {
                            moves.push({ r: nr, c: nc, jump: null });
                        } else if (checkersState[nr][nc].color !== piece.color) {
                            let nnr = nr + dr, nnc = nc + dc;
                            if (nnr >= 0 && nnr < 8 && nnc >= 0 && nnc < 8 && !checkersState[nnr][nnc]) {
                                moves.push({ r: nnr, c: nnc, jump: { r: nr, c: nc } });
                            }
                        }
                    }
                }
            });
            return moves;
        }

        function executeCheckersMove(from, to) {
            const piece = checkersState[from.r][from.c];
            checkersState[to.r][to.c] = piece;
            checkersState[from.r][from.c] = null;

            if (to.jump) {
                checkersState[to.jump.r][to.jump.c] = null;
            }

            // الترقية للعرش الملكي 👑
            if ((piece.color === 'white' && to.r === 0) || (piece.color === 'red' && to.r === 7)) {
                piece.isKing = true;
            }

            selectedSquare = null;
            validMoves = [];
            checkersTurn = checkersTurn === 'white' ? 'red' : 'white';
            renderCheckersBoard();
            updateCheckersStatus();

            if (currentMode === 'checkers-ai' && checkersTurn === 'red') {
                document.getElementById('statusBadge').innerText = "الحالة: تفكير ذكاء الداما الاصطناعي...";
                window.setTimeout(makeCheckersAIMove, 500);
            }
        }

        // ذكاء اصطناعي للداما
        function makeCheckersAIMove() {
            let allMoves = [];
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (checkersState[r][c] && checkersState[r][c].color === 'red') {
                        let mList = getCheckersMoves(r, c);
                        mList.forEach(m => allMoves.push({ from: { r, c }, to: m }));
                    }
                }
            }

            if (allMoves.length > 0) {
                // تقديم الأولوية لأكل قطع الخصم
                let jumps = allMoves.filter(m => m.to.jump);
                let chosen = jumps.length > 0 ? jumps[Math.floor(Math.random() * jumps.length)] : allMoves[Math.floor(Math.random() * allMoves.length)];
                executeCheckersMove(chosen.from, chosen.to);
            }
        }

        function updateCheckersStatus() {
            document.getElementById('statusBadge').innerText = `الحالة: دور ${checkersTurn === 'white' ? 'الأبيض' : 'الأحمر (إيشيك IA)'}`;
        }

        function resetGame() {
            if (currentMode.startsWith('chess')) initChessBoard();
            else initCheckersBoard();
        }

        initChessBoard();

        // الصوت والكاميرا وGroq API
        async function initMediaDevices() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {}
        }
        window.addEventListener('load', initMediaDevices);

        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.start();
            recognition.onresult = function(event) {
                document.getElementById('userTextInput').value = event.results[0][0].transcript;
                askAI();
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function askAI() {
            const userInput = document.getElementById('userTextInput').value.trim();
            const responseBox = document.getElementById('response-box');
            responseBox.innerText = "جاري التحليل والتقييم...";

            const gameType = currentMode.startsWith('chess') ? 'الشطرنج' : 'الداما';
            const promptText = `أنت مدرب خبير في لعبة ${gameType} واسمك "إيشيك IA". السؤال: ${userInput || 'اعطني نصيحة تكتيكية فورية لهذا الموقف'}. أجب باختصار باللغة العربية.`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: promptText }]
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;
                responseBox.innerText = reply;
                speakText(reply);
            } catch (err) {
                responseBox.innerText = "حدث خطأ في الاتصال بالذكاء الاصطناعي.";
            }
        }
    </script>
</body>
</html>
