<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إيشيك IA - منصة التدريب واللعب الذكية</title>

    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .menu-btn {
            background: #222;
            border: 1px solid #444;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1.2rem;
        }

        h1 {
            font-size: 1.4rem;
            color: #4CAF50;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background-color: #1e1e1e;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            z-index: 1000;
            transition: right 0.3s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ff5252;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .menu-item {
            background: #2a2a2a;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            cursor: pointer;
            text-align: right;
            font-size: 0.95rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-item.active {
            border-color: #4CAF50;
            background: #2e4c30;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }

        .overlay.active { display: block; }

        .main-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #board {
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .media-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            width: 100%;
        }

        video {
            width: 100%;
            height: 130px;
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            object-fit: cover;
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]:focus { border-color: #4CAF50; }

        .buttons-group {
            display: flex;
            gap: 10px;
        }

        button.btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-send { background-color: #4CAF50; color: white; }
        .btn-mic { background-color: #E91E63; color: white; }
        .btn-reset { background-color: #ff9800; color: white; }

        #response-box {
            background-color: #1e1e1e;
            border-right: 4px solid #4CAF50;
            padding: 15px;
            border-radius: 6px;
            min-height: 70px;
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: right;
            word-wrap: break-word;
        }

        .status-badge {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>إيشيك IA ♟️</h1>
        <button class="menu-btn" onclick="toggleMenu()">☰ القائمة</button>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>أنماط اللعب والتدريب</h3>
            <button class="close-btn" onclick="toggleMenu()">✕</button>
        </div>
        <div class="menu-item active" id="menu-vs-ai" onclick="setMode('vs-ai')">
            <span>🤖</span> اللعب ضد الذكاء الاصطناعي (متقدم)
        </div>
        <div class="menu-item" id="menu-chess-free" onclick="setMode('chess-free')">
            <span>♟️</span> تحليل الشطرنج الحر
        </div>
        <div class="menu-item" id="menu-checkers" onclick="setMode('checkers')">
            <span>🔴</span> لعبة الداما
        </div>
        <div class="menu-item" onclick="resetGame(); toggleMenu();">
            <span>🔄</span> إعادة اللعبة الحالية
        </div>
    </div>

    <div class="main-container">
        <div id="board"></div>

        <div class="media-section">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="controls-section">
            <input type="text" id="userTextInput" placeholder="اسأل الذكاء الاصطناعي عن خطتك أو التكتيك...">
            
            <div class="buttons-group">
                <button class="btn-action btn-send" onclick="askAI()">تحليل 🚀</button>
                <button class="btn-action btn-mic" onclick="startSpeech()">الميكروفون 🎙️</button>
                <button class="btn-action btn-reset" onclick="resetGame()">إعادة 🔄</button>
            </div>
        </div>

        <div id="response-box">أهلاً بك في إيشيك IA! اختر نمط اللعب ضد الذكاء الاصطناعي وابدأ باللعب بالأبيض.</div>
        <div class="status-badge" id="statusBadge">الحالة: دورك بالأبيض</div>
    </div>

    <script>
        const GROQ_API_KEY = "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";

        var board = null;
        var game = new Chess();
        var currentMode = 'vs-ai'; // النمط الافتراضي: اللعب ضد الذكاء الاصطناعي

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function pieceTheme(piece) {
            return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));

            if (mode === 'vs-ai') {
                document.getElementById('menu-vs-ai').classList.add('active');
                initChessBoard();
                speakText("بدأت لعبة جديدة ضد الذكاء الاصطناعي المتقدم. دورك الآن بالأبيض.");
            } else if (mode === 'chess-free') {
                document.getElementById('menu-chess-free').classList.add('active');
                initChessBoard();
                speakText("نمط التحليل الحر للشطرنج.");
            } else if (mode === 'checkers') {
                document.getElementById('menu-checkers').classList.add('active');
                initCheckersBoard();
            }
            toggleMenu();
        }

        function onDragStart (source, piece, board, orientation) {
            if (currentMode === 'checkers') return true;
            if (game.game_over()) return false;
            
            // في نمط اللعب ضد الذكاء الاصطناعي، يمنع تحريك القطع السوداء (دور الذكاء الاصطناعي)
            if (currentMode === 'vs-ai' && game.turn() === 'b') return false;

            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                return false;
            }
        }

        function onDrop (source, target) {
            if (currentMode === 'checkers') return;

            var move = game.move({
                from: source,
                to: target,
                promotion: 'q'
            });

            if (move === null) return 'snapback';

            updateStatus();

            // إذا كان النمط هو اللعب ضد الذكاء الاصطناعي وجاء دور الأسود
            if (currentMode === 'vs-ai' && !game.game_over() && game.turn() === 'b') {
                document.getElementById('statusBadge').innerText = "الحالة: تفكير الذكاء الاصطناعي...";
                window.setTimeout(makeAIMove, 400);
            }
        }

        // محرك الذكاء الاصطناعي المتقدم (Stockfish API) لحساب النقلة لـ الأسود
        async function makeAIMove() {
            const fen = encodeURIComponent(game.fen());
            try {
                const response = await fetch(`https://stockfish.online/api/s/v2.php?fen=${fen}&depth=10`);
                const data = await response.json();
                
                if (data.success && data.bestmove) {
                    const bestMove = data.bestmove.split(' ')[1]; // النقلة بصيغة e7e5
                    const fromSquare = bestMove.substring(0, 2);
                    const toSquare = bestMove.substring(2, 4);
                    const promo = bestMove.length > 4 ? bestMove.substring(4, 5) : 'q';

                    game.move({ from: fromSquare, to: toSquare, promotion: promo });
                    board.position(game.fen());
                    updateStatus();
                }
            } catch (err) {
                // إذا تعذر الاتصال بالمحرك، نفذ نقلة عشوائية كخيار احتياطي
                var moves = game.moves();
                var randomMove = moves[Math.floor(Math.random() * moves.length)];
                game.move(randomMove);
                board.position(game.fen());
                updateStatus();
            }
        }

        function onSnapEnd () {
            if (currentMode !== 'checkers') {
                board.position(game.fen());
            }
        }

        function updateStatus () {
            if (currentMode === 'checkers') return;
            var status = '';
            var moveColor = game.turn() === 'w' ? 'الأبيض (دورك)' : 'الأسود (إيشيك IA)';

            if (game.in_checkmate()) {
                status = 'انتهت اللعبة! كش مات لصالح ' + (game.turn() === 'w' ? 'الأسود' : 'الأبيض');
                speakText(status);
            } else if (game.in_draw()) {
                status = 'انتهت اللعبة بالتعادل';
                speakText(status);
            } else {
                status = 'الدور على: ' + moveColor;
                if (game.in_check()) status += ' (كش ملك!)';
            }
            document.getElementById('statusBadge').innerText = 'الحالة: ' + status;
        }

        function initChessBoard() {
            $('#board').empty();
            game.reset();
            board = Chessboard('board', {
                draggable: true,
                position: 'start',
                pieceTheme: pieceTheme,
                onDragStart: onDragStart,
                onDrop: onDrop,
                onSnapEnd: onSnapEnd
            });
            updateStatus();
        }

        function initCheckersBoard() {
            $('#board').empty();
            board = Chessboard('board', {
                draggable: true,
                dropOffBoard: 'remove',
                pieceTheme: pieceTheme,
                position: {
                    a1: 'bP', c1: 'bP', e1: 'bP', g1: 'bP',
                    b2: 'bP', d2: 'bP', f2: 'bP', h2: 'bP',
                    b8: 'wP', d8: 'wP', f8: 'wP', h8: 'wP',
                    a7: 'wP', c7: 'wP', e7: 'wP', g7: 'wP'
                }
            });
            document.getElementById('statusBadge').innerText = 'الحالة: لعبة الداما جاهزة';
            speakText("تم التغيير إلى لعبة الداما.");
        }

        function resetGame() {
            if (currentMode === 'checkers') {
                initCheckersBoard();
            } else {
                initChessBoard();
            }
        }

        initChessBoard();

        // تفعيل وسائل الإعلام
        async function initMediaDevices() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                document.getElementById('webcam').srcObject = stream;
            } catch (err) {
                console.error("خطأ الكاميرا/الميكروفون: ", err);
            }
        }
        window.addEventListener('load', initMediaDevices);

        function startSpeech() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("التعرف الصوتي غير مدعوم في متصفحك.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.start();
            recognition.onresult = function(event) {
                document.getElementById('userTextInput').value = event.results[0][0].transcript;
                askAI();
            };
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                window.speechSynthesis.speak(utterance);
            }
        }

        // تحليل الشطرنج والنقلات عبر Groq Llama-3
        async function askAI() {
            const userInput = document.getElementById('userTextInput').value.trim();
            const responseBox = document.getElementById('response-box');

            responseBox.innerText = "جاري التحليل والتقييم...";

            const currentFen = currentMode !== 'checkers' ? game.fen() : 'وضع الداما';
            const promptText = `أنت مدرب شطرنج محترف يسمى "إيشيك IA". الوضع الحالي للرقعة بترميز FEN هو: ${currentFen}. سؤال اللاعب: ${userInput || 'حلل لي أفضل خطة في هذا الموقف وقيّم الوضع'}. قدم نصيحة تكتيكية تعليمية قصيرة ومفيدة باللغة العربية.`;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [{ role: "user", content: promptText }]
                    })
                });

                const data = await response.json();
                const reply = data.choices[0].message.content;
                responseBox.innerText = reply;
                speakText(reply);
            } catch (err) {
                responseBox.innerText = "حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.";
            }
        }
    </script>
</body>
</html>
